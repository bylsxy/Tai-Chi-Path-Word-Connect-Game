<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>太极路径连词游戏</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#E2A76F">
    <link rel="apple-touch-icon" href="icon.png">
</head>
<body>
    <div id="game-app">
        <!-- Header -->
        <header class="header">
            <button id="btn-settings" class="icon-btn" aria-label="设置">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
                </svg>
                <span>设置</span>
            </button>
            <div class="level-info">
                <h1 id="level-title">太极路径连词</h1>
                <p id="current-word-display" style="min-height: 24px; color: var(--accent-color); font-weight: bold; font-size: 18px; margin: 5px 0;"></p>
                <p id="remaining-words">剩余词语: <span>0</span></p>
            </div>
            <div class="empty-space"></div>
        </header>

        <!-- Status / Timer -->
        <div class="status-bar">
            <h2>剩余时间: <span id="timer">60</span>s</h2>
        </div>
        
        <!-- Game Area -->
        <main class="game-container">
            <div id="board" class="board"></div>
        </main>

        <!-- Bottom Actions -->
        <footer class="bottom-bar">
            <button id="btn-restart" class="action-btn">
                <div class="btn-icon">
                    <svg viewBox="0 0 24 24" width="32" height="32">
                        <path fill="currentColor" d="M12,5V1L7,6l5,5V7c3.31,0,6,2.69,6,6s-2.69,6-6,6s-6-2.69-6-6H4c0,4.42,3.58,8,8,8s8-3.58,8-8S16.42,5,12,5z"/>
                    </svg>
                </div>
                <span>重玩</span>
            </button>
            <button id="btn-hint" class="action-btn">
                <div class="btn-icon">
                    <svg viewBox="0 0 24 24" width="32" height="32">
                        <path fill="currentColor" d="M9,21c0,0.55,0.45,1,1,1h4c0.55,0,1-0.45,1-1v-1H9V21z M12,2C8.14,2,5,5.14,5,9c0,2.38,1.19,4.47,2.96,5.74V17 c0,0.55,0.45,1,1,1h6c0.55,0,1-0.45,1-1v-2.26C17.81,13.47,19,11.38,19,9C19,5.14,15.86,2,12,2z M14.85,13.1l-0.85,0.6V16h-4v-2.3 l-0.85-0.6C7.8,12.16,7,10.63,7,9c0-2.76,2.24-5,5-5s5,2.24,5,5C17,10.63,16.2,12.16,14.85,13.1z"/>
                    </svg>
                </div>
                <span>提示</span>
            </button>
        </footer>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-spinner">
            <div class="spinner-ring"></div>
            <p>正在生成棋盘…</p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Custom Alert Modal (replaces native alert) -->
    <div id="alert-modal" class="modal hidden">
        <div class="modal-content text-center">
            <p id="alert-modal-msg" style="font-size: 16px; margin-bottom: 16px;"></p>
            <button id="btn-alert-ok" class="primary-btn">确定</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>游戏设置</h2>
                <button id="btn-close-settings" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="difficulty-select">游戏难度 (棋盘大小)</label>
                    <select id="difficulty-select">
                        <option value="6">简单 (6x6)</option>
                        <option value="8">中等 (8x8)</option>
                        <option value="10">困难 (10x10)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="word-list-input">词语列表 (每行一个)</label>
                    <textarea id="word-list-input" rows="8"></textarea>
                </div>
            </div>
            <div class="modal-footer" style="display: flex; gap: 10px;">
                <button id="btn-clear-storage" class="secondary-btn">恢复默认</button>
                <button id="btn-save-settings" class="primary-btn">保存并重新开始</button>
            </div>
        </div>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="modal hidden">
        <div class="modal-content text-center">
            <h2>🎉 恭喜通关! 🎉</h2>
            <p>你已经找出了所有太极招式！</p>
            <button id="btn-next-level" class="primary-btn mt-4">再来一局</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
